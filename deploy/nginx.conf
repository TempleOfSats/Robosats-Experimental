user http;
worker_processes auto;
pid /run/nginx.pid;

include /etc/nginx/modules/*.conf;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types_hash_max_size 4096;
  types_hash_bucket_size 128;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 30;
  keepalive_requests 1000;
  server_tokens off;

  open_file_cache max=10000 inactive=60s;
  open_file_cache_valid 120s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  # Prefer build-time Brotli and gzip representations. Dynamic gzip is only a
  # fallback for compressible files without a generated sidecar.
  brotli_static on;
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

  server {
    listen 127.0.0.1:5173;
    server_name _;
    root /srv/robosats-exp;
    index index.html;

    # scripts/deploy-nginx.mjs installs nodeapp/security-headers.conf here.
    # Nginx fails validation instead of serving without the shared policy.
    # Locations repeat the include because their Cache-Control header disables
    # inheritance of server-level add_header directives.
    include /etc/nginx/security-headers.conf;

    location = /index.html {
      include /etc/nginx/security-headers.conf;
      # Never cache the application entry point. Its asset manifest must be
      # re-read after deployment; the referenced hashed assets remain immutable.
      add_header Cache-Control "no-cache" always;
      try_files /index.html =404;
    }

    location ~ "^/(?:assets/[0-9a-f]{12}|static/[0-9a-f]{16})/" {
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
      log_not_found off;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=86400" always;
    }

    location /static/ {
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
