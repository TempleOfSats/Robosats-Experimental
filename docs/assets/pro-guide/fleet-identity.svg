<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">How a RoboSats Robot Fleet identity works</title>
  <desc id="desc">A Fleet key decrypts private Fleet records and derives up to six independent standard robot identities. Robot entries, offer presets, theme settings, and completed history are encrypted before NIP-78 events are sent to coordinator relays. The same key and encrypted records restore the Fleet on another device. Live trade status is fetched separately from coordinators.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-plum" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#8d3e76"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, system-ui, sans-serif; fill: #211d20; }
      .subtitle { font: 400 18px Inter, system-ui, sans-serif; fill: #625a5e; }
      .section { font: 700 18px Inter, system-ui, sans-serif; fill: #1769aa; }
      .heading { font: 700 21px Inter, system-ui, sans-serif; fill: #211d20; }
      .body { font: 400 16px Inter, system-ui, sans-serif; fill: #4f484c; }
      .small { font: 400 14px Inter, system-ui, sans-serif; fill: #625a5e; }
      .label { font: 700 14px Inter, system-ui, sans-serif; fill: #fff; letter-spacing: .04em; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1769aa; }
      .box { fill: #fff; stroke: #cdc5c8; stroke-width: 2; }
      .soft-blue { fill: #edf6fc; stroke: #7ab4db; stroke-width: 2; }
      .soft-plum { fill: #f8eef5; stroke: #c88aad; stroke-width: 2; }
      .soft-teal { fill: #eaf7f5; stroke: #64b7ae; stroke-width: 2; }
      .soft-gold { fill: #fff6e5; stroke: #e2a63e; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="980" fill="#faf9f7"/>
  <text x="70" y="65" class="title">How a Robot Fleet identity works</text>
  <text x="70" y="96" class="subtitle">One private key, independent RoboSats robots, and encrypted recovery across devices.</text>

  <rect x="50" y="125" width="1300" height="250" rx="12" fill="#f5f9fc" stroke="#1769aa" stroke-width="2"/>
  <text x="75" y="158" class="section">1. CREATED ON YOUR DEVICE</text>

  <rect x="80" y="185" width="290" height="145" rx="10" class="soft-gold"/>
  <circle cx="125" cy="230" r="25" fill="#f5ad32"/>
  <path d="M112 230a13 13 0 1 1 22 9l-2 2h-7v8h-9v-15h13a7 7 0 1 0-11-7" fill="none" stroke="#211d20" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="165" y="218" class="heading">Fleet key</text>
  <text x="165" y="245" class="mono">rsgarage1...</text>
  <text x="105" y="286" class="body">Only you should know it.</text>
  <text x="105" y="310" class="small">Back it up before adding robots.</text>

  <path d="M380 257H450" stroke="#1769aa" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="465" y="185" width="350" height="145" rx="10" class="soft-blue"/>
  <text x="490" y="218" class="heading">Local Fleet vault</text>
  <text x="490" y="249" class="body">Decrypts saved Fleet records</text>
  <text x="490" y="275" class="body">and derives one standard token</text>
  <text x="490" y="301" class="body">for each saved robot entry.</text>

  <path d="M825 257H890" stroke="#1769aa" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="905" y="175" width="410" height="165" rx="10" class="soft-teal"/>
  <text x="930" y="207" class="heading">Up to 6 independent robots</text>
  <g transform="translate(942 230)">
    <g transform="translate(0 0)">
      <circle cx="28" cy="28" r="27" fill="#5ec1bd"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#153f45" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#153f45"/><circle cx="33" cy="27" r="2.5" fill="#153f45"/>
      <path d="M22 34h12M28 15V9" stroke="#153f45" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(64 0)">
      <circle cx="28" cy="28" r="27" fill="#e89bc7"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#5f2347" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#5f2347"/><circle cx="33" cy="27" r="2.5" fill="#5f2347"/>
      <path d="M22 34h12M28 15V9" stroke="#5f2347" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(128 0)">
      <circle cx="28" cy="28" r="27" fill="#72b6e3"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#174d72" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#174d72"/><circle cx="33" cy="27" r="2.5" fill="#174d72"/>
      <path d="M22 34h12M28 15V9" stroke="#174d72" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(192 0)">
      <circle cx="28" cy="28" r="27" fill="#f0bc63"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#664514" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#664514"/><circle cx="33" cy="27" r="2.5" fill="#664514"/>
      <path d="M22 34h12M28 15V9" stroke="#664514" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(256 0)">
      <circle cx="28" cy="28" r="27" fill="#a99ad7"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#44356f" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#44356f"/><circle cx="33" cy="27" r="2.5" fill="#44356f"/>
      <path d="M22 34h12M28 15V9" stroke="#44356f" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(320 0)">
      <circle cx="28" cy="28" r="27" fill="#88c77e"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#2e5b2a" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#2e5b2a"/><circle cx="33" cy="27" r="2.5" fill="#2e5b2a"/>
      <path d="M22 34h12M28 15V9" stroke="#2e5b2a" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <text x="930" y="318" class="small">Each has its own token, keys, avatar, chat, and one-order limit.</text>

  <rect x="50" y="400" width="1300" height="300" rx="12" fill="#fbf7fa" stroke="#8d3e76" stroke-width="2"/>
  <text x="75" y="433" class="section" fill="#8d3e76">2. ENCRYPTED BEFORE IT LEAVES THE DEVICE</text>

  <rect x="80" y="465" width="250" height="150" rx="10" class="box"/>
  <rect x="80" y="465" width="250" height="34" rx="10" fill="#1769aa"/>
  <rect x="80" y="489" width="250" height="10" fill="#1769aa"/>
  <text x="101" y="488" class="label">ROBOT FLEET</text>
  <text x="102" y="530" class="body">Saved robot entries</text>
  <text x="102" y="557" class="body">Identity metadata</text>
  <text x="102" y="584" class="body">Removal markers</text>

  <rect x="350" y="465" width="250" height="150" rx="10" class="box"/>
  <rect x="350" y="465" width="250" height="34" rx="10" fill="#0f8f8b"/>
  <rect x="350" y="489" width="250" height="10" fill="#0f8f8b"/>
  <text x="371" y="488" class="label">PREFERENCES</text>
  <text x="372" y="530" class="body">Offer presets</text>
  <text x="372" y="557" class="body">Theme setting</text>
  <text x="372" y="584" class="small">Separate signing domain</text>

  <rect x="620" y="465" width="250" height="150" rx="10" class="box"/>
  <rect x="620" y="465" width="250" height="34" rx="10" fill="#8d3e76"/>
  <rect x="620" y="489" width="250" height="10" fill="#8d3e76"/>
  <text x="641" y="488" class="label">COMPLETED HISTORY</text>
  <text x="642" y="530" class="body">Completed trades</text>
  <text x="642" y="557" class="body">Collaborative cancels</text>
  <text x="642" y="584" class="small">Separate signing domain</text>

  <path d="M880 540H930" stroke="#8d3e76" stroke-width="4" marker-end="url(#arrow-plum)"/>

  <rect x="945" y="455" width="170" height="170" rx="10" class="soft-plum"/>
  <path d="M997 520v-18a33 33 0 0 1 66 0v18M984 520h92v72h-92z" fill="none" stroke="#8d3e76" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="1030" cy="555" r="7" fill="#8d3e76"/>
  <path d="M1030 562v13" stroke="#8d3e76" stroke-width="5" stroke-linecap="round"/>
  <text x="982" y="606" class="small">NIP-44 ciphertext</text>

  <path d="M1125 540H1170" stroke="#8d3e76" stroke-width="4" marker-end="url(#arrow-plum)"/>

  <rect x="1185" y="455" width="135" height="170" rx="10" class="soft-blue"/>
  <ellipse cx="1252" cy="499" rx="42" ry="14" fill="#fff" stroke="#1769aa" stroke-width="3"/>
  <path d="M1210 499v59c0 8 19 14 42 14s42-6 42-14v-59M1210 529c0 8 19 14 42 14s42-6 42-14" fill="none" stroke="#1769aa" stroke-width="3"/>
  <text x="1213" y="596" class="small">Coordinator</text>
  <text x="1228" y="615" class="small">relays</text>

  <rect x="80" y="640" width="1240" height="38" rx="8" fill="#fff"/>
  <text x="100" y="665" class="small">NIP-78 kind 30078 events use opaque record addresses. Relays store signed ciphertext and event metadata, not the plaintext above.</text>

  <rect x="50" y="725" width="1300" height="190" rx="12" fill="#f4faf8" stroke="#0f8f8b" stroke-width="2"/>
  <text x="75" y="758" class="section" fill="#0f8f8b">3. RESTORED ON ANOTHER DEVICE</text>

  <rect x="85" y="790" width="250" height="85" rx="10" class="soft-gold"/>
  <text x="110" y="823" class="heading">Same Fleet key</text>
  <text x="110" y="851" class="small">Entered locally on the new device</text>

  <path d="M345 832H430" stroke="#0f8f8b" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="445" y="790" width="310" height="85" rx="10" class="soft-blue"/>
  <text x="470" y="823" class="heading">Fetch encrypted records</text>
  <text x="470" y="851" class="small">From any reachable retaining relay</text>

  <path d="M765 832H850" stroke="#0f8f8b" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="865" y="790" width="430" height="85" rx="10" class="soft-teal"/>
  <text x="890" y="823" class="heading">Decrypt and rebuild the Robot Fleet</text>
  <text x="890" y="851" class="small">Robots, presets, theme, and completed history return</text>

  <rect x="50" y="935" width="1300" height="30" rx="8" fill="#fff1d6"/>
  <text x="70" y="956" class="small" fill="#6c4a0b">Live order status is not a Fleet backup record. After restore, the client checks each robot with its coordinators.</text>
</svg>
