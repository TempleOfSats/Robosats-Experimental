<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1500" viewBox="0 0 1400 1500" role="img" aria-labelledby="title desc">
  <title id="title">RoboSats Robot Fleet identity architecture</title>
  <desc id="desc">A technical diagram showing how a private 32-byte Fleet secret derives independent standard RoboSats robot tokens and separate synchronization signing keys. Fleet records are assigned opaque HMAC addresses, encrypted with NIP-44, signed as NIP-78 kind 30078 events, stored by coordinator relays, and later restored and verified on another device.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#17324d" flood-opacity=".14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-plum" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#852f72"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#087f78"/>
    </marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", Arial, sans-serif; fill: #242124; }
      .title { font-size: 43px; font-weight: 760; }
      .subtitle { font-size: 19px; fill: #625b60; }
      .section-title { font-size: 20px; font-weight: 760; letter-spacing: .02em; }
      .section-note { font-size: 14px; fill: #e8f3fb; }
      .step { font-size: 22px; font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .heading { font-size: 20px; font-weight: 760; }
      .subheading { font-size: 16px; font-weight: 720; }
      .body { font-size: 15px; fill: #4f4950; }
      .small { font-size: 13px; fill: #655e65; }
      .tiny { font-size: 12px; fill: #6d666d; }
      .mono { font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-size: 13px; font-weight: 650; fill: #145f9b; }
      .mono-plum { font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-size: 13px; font-weight: 650; fill: #7c2d69; }
      .box { fill: #fff; stroke: #b9c4ce; stroke-width: 2; filter: url(#shadow); }
      .box-blue { fill: #fff; stroke: #4794d0; stroke-width: 2; filter: url(#shadow); }
      .box-plum { fill: #fff; stroke: #b65a94; stroke-width: 2; filter: url(#shadow); }
      .box-teal { fill: #fff; stroke: #39a49c; stroke-width: 2; filter: url(#shadow); }
      .line-blue { fill: none; stroke: #1769aa; stroke-width: 4; marker-end: url(#arrow-blue); }
      .line-plum { fill: none; stroke: #852f72; stroke-width: 4; marker-end: url(#arrow-plum); }
      .line-teal { fill: none; stroke: #087f78; stroke-width: 4; marker-end: url(#arrow-teal); }
    </style>
  </defs>

  <rect width="1400" height="1500" fill="#fbfaf9"/>
  <text x="56" y="66" class="title">RoboSats Robot Fleet Identities</text>
  <text x="56" y="99" class="subtitle">One private Fleet secret, independent standard robots, and encrypted multi-device recovery.</text>
  <rect x="1090" y="46" width="250" height="42" rx="21" fill="#fff2dc" stroke="#e2a23c" stroke-width="1.5"/>
  <text x="1215" y="72" class="subheading" text-anchor="middle" fill="#80520a">PRO MODE ARCHITECTURE</text>

  <!-- Client-side derivation -->
  <rect x="40" y="125" width="1320" height="575" rx="12" fill="#f1f7fd" stroke="#1769aa" stroke-width="3"/>
  <rect x="40" y="125" width="1320" height="52" rx="12" fill="#1769aa"/>
  <rect x="40" y="160" width="1320" height="17" fill="#1769aa"/>
  <text x="66" y="158" class="section-title" fill="#fff">CLIENT DEVICE / PRIVATE DERIVATION BOUNDARY</text>
  <text x="1334" y="157" class="section-note" text-anchor="end">Fleet secret and derived private keys never go to a coordinator</text>

  <circle cx="83" cy="226" r="24" fill="#1769aa"/>
  <text x="83" y="226" class="step">1</text>
  <rect x="70" y="255" width="276" height="174" rx="8" class="box-blue"/>
  <rect x="70" y="255" width="276" height="38" rx="8" fill="#e7f2fb"/>
  <rect x="70" y="283" width="276" height="10" fill="#e7f2fb"/>
  <text x="92" y="281" class="heading">Fleet key</text>
  <text x="92" y="321" class="mono">rsgarage1...</text>
  <text x="92" y="350" class="body">Bech32m version 1 envelope</text>
  <text x="92" y="376" class="body">around a random 32-byte secret.</text>
  <text x="92" y="407" class="tiny">Generated and entered only on-device.</text>
  <path d="M105 235h42l14 14-14 14h-42l-14-14z" fill="#f5ad32" stroke="#8c5a08" stroke-width="2"/>
  <circle cx="118" cy="249" r="5" fill="none" stroke="#8c5a08" stroke-width="2"/>

  <path d="M357 342H405" class="line-blue"/>

  <circle cx="429" cy="226" r="24" fill="#1769aa"/>
  <text x="429" y="226" class="step">2</text>
  <rect x="416" y="255" width="370" height="174" rx="8" class="box-blue"/>
  <rect x="416" y="255" width="370" height="38" rx="8" fill="#e7f2fb"/>
  <rect x="416" y="283" width="370" height="10" fill="#e7f2fb"/>
  <text x="438" y="281" class="heading">Domain-separated HKDF</text>
  <text x="438" y="320" class="mono">HKDF-SHA256(fleetSecret, salt, info)</text>
  <line x1="438" y1="340" x2="762" y2="340" stroke="#c8d6e2"/>
  <text x="438" y="367" class="body">Robot path: entry ID + counter</text>
  <text x="438" y="392" class="body">Sync paths: garage / settings / history</text>
  <text x="438" y="416" class="tiny">Separate info strings prevent cross-purpose key reuse.</text>

  <path d="M797 319H845" class="line-blue"/>

  <circle cx="869" cy="206" r="24" fill="#1769aa"/>
  <text x="869" y="206" class="step">3</text>
  <rect x="856" y="235" width="467" height="222" rx="8" class="box-blue"/>
  <rect x="856" y="235" width="467" height="38" rx="8" fill="#e7f2fb"/>
  <rect x="856" y="263" width="467" height="10" fill="#e7f2fb"/>
  <text x="878" y="261" class="heading">Up to 6 independent standard robots</text>
  <g transform="translate(882 291)">
    <g transform="translate(0 0)">
      <circle cx="28" cy="28" r="27" fill="#63c4bf"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#153f45" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#153f45"/><circle cx="33" cy="27" r="2.5" fill="#153f45"/>
      <path d="M22 34h12M28 15V9" stroke="#153f45" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(67 0)">
      <circle cx="28" cy="28" r="27" fill="#e89bc7"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#5f2347" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#5f2347"/><circle cx="33" cy="27" r="2.5" fill="#5f2347"/>
      <path d="M22 34h12M28 15V9" stroke="#5f2347" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(134 0)">
      <circle cx="28" cy="28" r="27" fill="#72b6e3"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#174d72" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#174d72"/><circle cx="33" cy="27" r="2.5" fill="#174d72"/>
      <path d="M22 34h12M28 15V9" stroke="#174d72" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(201 0)">
      <circle cx="28" cy="28" r="27" fill="#f0bc63"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#664514" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#664514"/><circle cx="33" cy="27" r="2.5" fill="#664514"/>
      <path d="M22 34h12M28 15V9" stroke="#664514" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(268 0)">
      <circle cx="28" cy="28" r="27" fill="#a99ad7"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#44356f" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#44356f"/><circle cx="33" cy="27" r="2.5" fill="#44356f"/>
      <path d="M22 34h12M28 15V9" stroke="#44356f" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(335 0)">
      <circle cx="28" cy="28" r="27" fill="#88c77e"/>
      <rect x="14" y="15" width="28" height="25" rx="7" fill="none" stroke="#2e5b2a" stroke-width="3"/>
      <circle cx="23" cy="27" r="2.5" fill="#2e5b2a"/><circle cx="33" cy="27" r="2.5" fill="#2e5b2a"/>
      <path d="M22 34h12M28 15V9" stroke="#2e5b2a" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <text x="878" y="384" class="mono">HKDF output -&gt; 36-character robot token</text>
  <text x="878" y="406" class="small">Each token follows the normal RoboSats identity path:</text>
  <text x="878" y="424" class="tiny">SHA2562(token) -&gt; coordinator robot ID, avatar and nickname</text>
  <text x="878" y="439" class="tiny">SHA256(SHA512(token)) -&gt; Nostr secret/public key</text>
  <text x="878" y="454" class="tiny">OpenPGP private key -&gt; encrypted with the robot token</text>

  <path d="M601 440V482" class="line-blue"/>

  <circle cx="83" cy="491" r="24" fill="#1769aa"/>
  <text x="83" y="491" class="step">4</text>
  <rect x="70" y="520" width="716" height="137" rx="8" class="box"/>
  <text x="92" y="550" class="heading">Local records contain no Fleet key or derived robot token</text>
  <g transform="translate(92 570)">
    <rect width="206" height="62" rx="6" fill="#e7f2fb" stroke="#4794d0"/>
    <text x="14" y="24" class="subheading">Robot records</text>
    <text x="14" y="42" class="tiny">entry ID, token hash, nickname</text>
    <text x="14" y="57" class="tiny">revision and removal tombstone</text>
  </g>
  <g transform="translate(315 570)">
    <rect width="206" height="62" rx="6" fill="#e7f7f4" stroke="#39a49c"/>
    <text x="14" y="24" class="subheading">Settings records</text>
    <text x="14" y="42" class="tiny">offer presets and theme</text>
    <text x="14" y="57" class="tiny">revisions and tombstones</text>
  </g>
  <g transform="translate(538 570)">
    <rect width="226" height="62" rx="6" fill="#f8eaf3" stroke="#b65a94"/>
    <text x="14" y="24" class="subheading">History records</text>
    <text x="14" y="42" class="tiny">completed trade summaries</text>
    <text x="14" y="57" class="tiny">collaborative cancellations</text>
  </g>

  <path d="M797 567H845" class="line-blue"/>

  <circle cx="869" cy="491" r="24" fill="#1769aa"/>
  <text x="869" y="491" class="step">5</text>
  <rect x="856" y="520" width="467" height="137" rx="8" class="box-blue"/>
  <text x="878" y="550" class="heading">Domain signing identities</text>
  <text x="878" y="582" class="mono">garage-sync   -&gt; secp256k1 key A</text>
  <text x="878" y="607" class="mono">settings-sync -&gt; secp256k1 key B</text>
  <text x="878" y="632" class="mono">history-sync  -&gt; secp256k1 key C</text>

  <!-- Nostr record transport -->
  <rect x="40" y="730" width="1320" height="390" rx="12" fill="#fbf4f9" stroke="#852f72" stroke-width="3"/>
  <rect x="40" y="730" width="1320" height="52" rx="12" fill="#852f72"/>
  <rect x="40" y="765" width="1320" height="17" fill="#852f72"/>
  <text x="66" y="763" class="section-title" fill="#fff">NOSTR SYNCHRONIZATION / PUBLIC RELAY BOUNDARY</text>
  <text x="1334" y="762" class="section-note" text-anchor="end">Relays retain signed event metadata and ciphertext</text>

  <circle cx="84" cy="829" r="24" fill="#852f72"/>
  <text x="84" y="829" class="step">6</text>

  <rect x="70" y="858" width="220" height="146" rx="8" class="box-plum"/>
  <text x="88" y="887" class="subheading">Canonical record</text>
  <text x="88" y="917" class="mono-plum">{ type, id, revision,</text>
  <text x="88" y="940" class="mono-plum">  writerDeviceId,</text>
  <text x="88" y="963" class="mono-plum">  updatedAt, value }</text>
  <text x="88" y="989" class="small">Maximum plaintext: 8 KiB</text>

  <path d="M302 931H326" class="line-plum"/>

  <rect x="338" y="858" width="220" height="146" rx="8" class="box-plum"/>
  <text x="356" y="887" class="subheading">Opaque address</text>
  <text x="356" y="917" class="mono-plum">d = HMAC-SHA256(</text>
  <text x="356" y="940" class="mono-plum">  domainKey,</text>
  <text x="356" y="963" class="mono-plum">  type + id + writer)</text>
  <text x="356" y="989" class="small">No plaintext record ID in the tag</text>

  <path d="M570 931H594" class="line-plum"/>

  <rect x="606" y="858" width="220" height="146" rx="8" class="box-plum"/>
  <text x="624" y="887" class="subheading">NIP-44 encryption</text>
  <text x="624" y="917" class="mono-plum">conversationKey(</text>
  <text x="624" y="940" class="mono-plum">  domainKey,</text>
  <text x="624" y="963" class="mono-plum">  own domain pubkey)</text>
  <text x="624" y="989" class="small">JSON record becomes ciphertext</text>

  <path d="M838 931H862" class="line-plum"/>

  <rect x="874" y="840" width="236" height="182" rx="8" class="box-plum"/>
  <text x="892" y="870" class="subheading">Signed NIP-78 event</text>
  <text x="892" y="901" class="mono-plum">kind: 30078</text>
  <text x="892" y="925" class="mono-plum">pubkey: domain author</text>
  <text x="892" y="949" class="mono-plum">tags: [["d", opaqueHash]]</text>
  <text x="892" y="973" class="mono-plum">content: nip44Ciphertext</text>
  <text x="892" y="997" class="mono-plum">sig: Schnorr signature</text>

  <path d="M1122 931H1146" class="line-plum"/>

  <rect x="1158" y="840" width="170" height="182" rx="8" class="box-blue"/>
  <ellipse cx="1243" cy="884" rx="48" ry="16" fill="#eef7fd" stroke="#1769aa" stroke-width="3"/>
  <path d="M1195 884v62c0 9 21 16 48 16s48-7 48-16v-62M1195 915c0 9 21 16 48 16s48-7 48-16" fill="none" stroke="#1769aa" stroke-width="3"/>
  <text x="1243" y="988" class="subheading" text-anchor="middle">Coordinator relays</text>
  <text x="1243" y="1009" class="tiny" text-anchor="middle">publish to reachable set</text>

  <rect x="70" y="1045" width="1258" height="48" rx="7" fill="#fff"/>
  <text x="90" y="1065" class="subheading" fill="#852f72">Relay-visible</text>
  <text x="238" y="1065" class="small">domain author, event time, opaque address, ciphertext size and signature.</text>
  <text x="90" y="1086" class="subheading" fill="#087f78">Not plaintext</text>
  <text x="238" y="1086" class="small">Fleet key, robot tokens, nicknames, preset terms, trade summary or settlement invoice.</text>

  <!-- Restore -->
  <rect x="40" y="1150" width="1320" height="300" rx="12" fill="#f1faf8" stroke="#087f78" stroke-width="3"/>
  <rect x="40" y="1150" width="1320" height="52" rx="12" fill="#087f78"/>
  <rect x="40" y="1185" width="1320" height="17" fill="#087f78"/>
  <text x="66" y="1183" class="section-title" fill="#fff">RESTORE ON ANOTHER DEVICE</text>
  <text x="1334" y="1182" class="section-note" text-anchor="end">The new device repeats the same deterministic derivations</text>

  <circle cx="84" cy="1250" r="24" fill="#087f78"/>
  <text x="84" y="1250" class="step">7</text>
  <rect x="70" y="1279" width="245" height="112" rx="8" class="box-teal"/>
  <text x="92" y="1311" class="heading">Enter the same key</text>
  <text x="92" y="1341" class="mono">rsgarage1...</text>
  <text x="92" y="1370" class="small">Derive domain authors locally</text>

  <path d="M327 1335H365" class="line-teal"/>

  <rect x="377" y="1279" width="260" height="112" rx="8" class="box-teal"/>
  <text x="399" y="1311" class="heading">Query relays</text>
  <text x="399" y="1341" class="mono">REQ kind 30078 + authors</text>
  <text x="399" y="1370" class="small">Fetch encrypted record versions</text>

  <path d="M649 1335H687" class="line-teal"/>

  <rect x="699" y="1260" width="278" height="150" rx="8" class="box-teal"/>
  <text x="721" y="1292" class="heading">Decrypt and verify</text>
  <text x="721" y="1322" class="small">1. Verify event signature and size</text>
  <text x="721" y="1346" class="small">2. NIP-44 decrypt by domain</text>
  <text x="721" y="1370" class="small">3. Validate schema and d address</text>
  <text x="721" y="1394" class="small">4. Resolve revisions and tombstones</text>

  <path d="M989 1335H1027" class="line-teal"/>

  <circle cx="1048" cy="1230" r="24" fill="#087f78"/>
  <text x="1048" y="1230" class="step">8</text>
  <rect x="1039" y="1260" width="289" height="150" rx="8" class="box-teal"/>
  <text x="1061" y="1292" class="heading">Rebuild the Fleet</text>
  <text x="1061" y="1322" class="small">Derive each standard token from</text>
  <text x="1061" y="1346" class="small">its entry ID and verify tokenId.</text>
  <text x="1061" y="1376" class="small">Restore robots, presets, theme and</text>
  <text x="1061" y="1400" class="small">completed-trade history.</text>

  <rect x="40" y="1466" width="1320" height="24" rx="5" fill="#fff0d4"/>
  <text x="700" y="1483" class="small" text-anchor="middle" fill="#72500d">Live order state is intentionally outside the Fleet backup; after restore, each robot is checked with its coordinators through the normal API.</text>
</svg>
