<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <link rel="icon" href="/static/assets/vector/R-notext.svg" type="image/svg+xml" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoboSats Exp.</title>
    <script>
      window.RobosatsSettings = window.RobosatsSettings ||
        (navigator.userAgent.includes("RoboSatsExp") ? "mobile-basic" : "web-basic");
      try {
        const preferences = JSON.parse(localStorage.getItem("robosats_exp_ui_preferences") || "{}");
        document.documentElement.dataset.theme = preferences.theme === "light" ? "light" : "dark";
      } catch {}
    </script>
    <style>
      :root {
        --boot-background: #0b0909;
        --boot-foreground: #f4f1ed;
        --boot-muted: #c5beb8;
        --boot-track: #443d40;
        --boot-primary: #ffb23f;
      }

      :root[data-theme="light"] {
        --boot-background: #f7f6f3;
        --boot-foreground: #211a16;
        --boot-muted: #5f5953;
        --boot-track: #c8c4ba;
      }

      body {
        margin: 0;
        background: var(--boot-background);
      }

      body.app-booting {
        overflow: hidden;
      }

      #root {
        opacity: 1;
        transition: opacity 180ms ease;
      }

      body.app-booting #root {
        opacity: 0;
      }

      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: var(--boot-background);
        color: var(--boot-foreground);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
        opacity: 1;
        transition: opacity 280ms ease, visibility 280ms ease;
      }

      #app-boot[data-state="leaving"] {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .app-boot-content {
        width: min(320px, calc(100vw - 48px));
        display: grid;
        justify-items: center;
        text-align: center;
      }

      .app-boot-mark {
        position: relative;
        width: 142px;
        height: 142px;
        display: grid;
        place-items: center;
        contain: layout paint;
      }

      .app-boot-mark::before,
      .app-boot-mark::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
      }

      .app-boot-mark::before {
        border: 2px solid var(--boot-track);
      }

      .app-boot-mark::after {
        background: conic-gradient(from 0deg, var(--boot-primary) 0deg 72deg, transparent 72deg 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        animation: app-boot-orbit 5.2s linear infinite;
        will-change: transform;
      }

      .app-boot-mark img {
        position: relative;
        width: 94px;
        height: 94px;
        translate: 3px 12px;
        filter: invert(1);
        opacity: 0.94;
      }

      :root[data-theme="light"] .app-boot-mark img {
        filter: none;
      }

      .app-boot-title {
        margin: 24px 0 0;
        color: var(--boot-foreground);
        font-size: 22px;
        font-weight: 600;
        line-height: 1.25;
      }

      .app-boot-message {
        min-height: 42px;
        margin: 10px 0 18px;
        display: grid;
        place-items: center;
        color: var(--boot-muted);
        font-size: 14px;
        line-height: 1.45;
        opacity: 1;
        transition: opacity 150ms ease;
      }

      .app-boot-message[data-changing="true"] {
        opacity: 0;
      }

      .app-boot-track {
        width: 100%;
        height: 3px;
        overflow: hidden;
        background: var(--boot-track);
      }

      .app-boot-progress {
        width: 2%;
        height: 100%;
        background: var(--boot-primary);
        transform-origin: left center;
        transition: width 100ms linear;
      }

      .app-boot-percent {
        margin-top: 9px;
        color: var(--boot-muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .app-boot-retry {
        margin-top: 18px;
        min-height: 44px;
        border: 1px solid var(--boot-primary);
        border-radius: 6px;
        padding: 10px 18px;
        background: var(--boot-primary);
        color: #211a16;
        font: 600 15px/20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
      }

      .app-boot-retry[hidden] {
        display: none;
      }

      @keyframes app-boot-orbit {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #root,
        #app-boot,
        .app-boot-message,
        .app-boot-progress {
          transition-duration: 0.01ms;
        }

        .app-boot-mark::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="app-booting">
    <div id="app-boot" role="status" aria-live="polite" aria-label="Preparing RoboSats">
      <div class="app-boot-content">
        <div class="app-boot-mark" aria-hidden="true">
          <img src="/static/assets/vector/R-notext.svg" alt="" />
        </div>
        <h1 class="app-boot-title">Preparing RoboSats</h1>
        <p class="app-boot-message">Loading the private interface...</p>
        <div class="app-boot-track" aria-hidden="true">
          <div class="app-boot-progress"></div>
        </div>
        <div class="app-boot-percent" aria-hidden="true">2%</div>
        <button class="app-boot-retry" type="button" hidden>Try again</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const overlay = document.getElementById("app-boot");
        const message = overlay.querySelector(".app-boot-message");
        const progress = overlay.querySelector(".app-boot-progress");
        const percent = overlay.querySelector(".app-boot-percent");
        const retry = overlay.querySelector(".app-boot-retry");
        const applicationStyles = [...document.querySelectorAll("link[data-robosats-app-style]")];
        const messages = [
          "Loading the private interface...",
          "Restoring your local settings...",
          "Checking local exchange data...",
          "Preparing the order book..."
        ];
        const BOOT_MARK_FALLBACK =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><g>' +
          '<path d="M602.336,731.51c16.747-16.94,29.249-35.524,37.504-56.694c18.792-48.193,16.967-94.996-10.46-139.81 c-10.255-16.756-24.983-29.293-39.461-42.103c-67.731-59.932-135.412-119.919-203.104-179.895 c-0.368-0.326-0.644-0.755-1.331-1.579c18.529-12.477,36.983-24.903,55.872-37.62c-9.61-6.799-18.917-13.385-28.648-20.27 c11.763-14.483,23.273-28.656,34.738-42.773c13.313,7.081,24.784,5.523,32.075-4.132c6.395-8.467,5.794-20.59-1.412-28.52 c-7.011-7.713-19.494-9.295-28.343-3.592c-10.274,6.623-12.651,17.652-6.576,31.65c-22.681,16.451-45.436,32.955-68.921,49.989 c9.33,6.786,18.246,13.271,27.611,20.084c-9.232,8.573-18.09,16.797-27.064,25.131c-68.348-47.917-134.895-38.158-199.771,10.745 c0-100.562,0-201.3,0-302.535c1.811-0.082,3.562-0.23,5.313-0.23c97.991-0.011,195.983-0.214,293.973,0.094 c37.661,0.119,75.351,1.898,112.093,11.01c52.81,13.096,95.741,40.904,125.379,87.462c13.802,21.681,20.643,45.764,23.136,71.039 c3.595,36.436,1.313,72.517-8.858,107.873c-11.943,41.515-37.09,74.011-69.641,101.357c-16.133,13.552-33.803,24.811-52.581,34.343 c-1.3,0.659-2.533,1.445-4.148,2.375c80.735,102.152,161.255,204.034,242.318,306.6C761.843,731.51,682.637,731.51,602.336,731.51z"/>' +
          '<path d="M282.877,389.186c25.706-0.109,46.42,20.376,46.55,46.038c0.131,25.994-20.404,46.852-46.238,46.96 c-25.588,0.108-46.928-21.172-46.758-46.627C236.602,409.95,257.291,389.295,282.877,389.186z"/>' +
          '<path d="M445.93,607.736c0.705-26.031,21.515-46.381,46.915-45.881c26.295,0.52,46.657,21.756,45.918,47.887 c-0.721,25.455-21.862,45.67-47.178,45.104C465.779,654.273,445.244,633.082,445.93,607.736z"/>' +
          '<path d="M175.223,550.758c23.365,20.689,46.15,40.865,69.337,61.396c-4.974,5.619-9.792,11.063-14.91,16.846 c-5.634-4.988-11.167-9.738-16.519-14.684c-3.131-2.896-5.343-2.492-8.415,0.467c-9.944,9.58-20.234,18.801-29.493,27.332 C175.223,613.414,175.223,582.512,175.223,550.758z"/>' +
          '<path d="M379.124,731.533c-30.045,0-59.057,0-89.151,0c8.955-9.23,17.236-17.769,25.724-26.519 c-6.368-5.709-12.409-11.127-18.739-16.803c4.904-5.559,9.594-10.877,14.65-16.608C334.013,691.492,356.2,711.186,379.124,731.533z"/>' +
          "</g></svg>";
        const startedAt = performance.now();
        let shown = 2;
        let stageTarget = 2;
        let messageIndex = 0;
        let appReady = false;
        let scriptLoadFailed = false;
        let pendingStyles = applicationStyles.length;
        let styleLoadFailed = false;
        let retryShown = false;
        let applicationFontReady = !document.fonts;
        let applicationFontLoadStarted = false;
        let ready = false;
        let finished = false;
        let previousFrame = startedAt;

        retry.addEventListener("click", () => {
          const url = new URL(window.location.href);
          url.searchParams.set("reload", Date.now().toString());
          window.location.replace(url);
        });

        const bootMark = overlay.querySelector(".app-boot-mark img");
        if (bootMark) {
          // Keep the brand mark visible when the static asset request fails
          // over a flaky Tor stream; the inline fallback is CSP-permitted.
          bootMark.addEventListener("error", () => {
            bootMark.src = "data:image/svg+xml," + encodeURIComponent(BOOT_MARK_FALLBACK);
          }, { once: true });
        }

        const finish = () => {
          if (finished) return;
          finished = true;
          window.removeEventListener("error", onResourceError, true);
          progress.style.width = "100%";
          percent.textContent = "100%";
          window.setTimeout(() => {
            overlay.dataset.state = "leaving";
            document.body.classList.remove("app-booting");
            window.setTimeout(() => overlay.remove(), 300);
          }, 120);
        };

        // Tor streams fail without a page-level error; surface a broken
        // application bundle or stylesheet immediately instead of holding
        // the overlay at its synthetic ceiling.
        const onResourceError = (event) => {
          const target = event.target;
          if (!target || target === window) return;
          const tag = target.tagName;
          if (tag === "SCRIPT" || (tag === "LINK" && target.hasAttribute("data-robosats-app-style"))) {
            if (tag === "SCRIPT") scriptLoadFailed = true;
            else styleLoadFailed = true;
            showRetry("The private interface could not be loaded. Try again.");
          }
        };
        window.addEventListener("error", onResourceError, true);

        const showRetry = (text) => {
          if (finished || retryShown) return;
          retryShown = true;
          setMessage(text);
          retry.hidden = false;
        };

        const interpolate = (start, end, fraction) =>
          start + (end - start) * Math.max(0, Math.min(1, fraction));

        const syntheticTarget = (elapsed) => {
          if (elapsed < 500) return interpolate(2, 18, elapsed / 500);
          if (elapsed < 1400) return interpolate(18, 44, (elapsed - 500) / 900);
          if (elapsed < 3600) return interpolate(44, 70, (elapsed - 1400) / 2200);
          return 70;
        };

        const setMessage = (text) => {
          if (message.textContent === text) return;
          message.dataset.changing = "true";
          window.setTimeout(() => {
            message.textContent = text;
            message.dataset.changing = "false";
          }, 150);
        };

        const maybeFinish = () => {
          if (!appReady || scriptLoadFailed || pendingStyles > 0 || styleLoadFailed) return;
          if (!applicationFontLoadStarted) {
            loadApplicationFont();
            return;
          }
          if (!applicationFontReady) return;
          ready = true;
          stageTarget = 100;
          setMessage("RoboSats is ready.");
          finish();
        };

        const loadApplicationFont = () => {
          if (applicationFontLoadStarted) return;
          applicationFontLoadStarted = true;
          if (!document.fonts) {
            applicationFontReady = true;
            maybeFinish();
            return;
          }

          let settled = false;
          const complete = () => {
            if (settled) return;
            settled = true;
            applicationFontReady = true;
            maybeFinish();
          };
          window.setTimeout(complete, 5000);
          document.fonts.load('400 1em "Public Sans Variable"', "RoboSats").then(complete, complete);
        };

        const activateApplicationStyles = () => {
          for (const link of applicationStyles) {
            let settled = false;
            const loaded = () => {
              if (settled) return;
              settled = true;
              pendingStyles = Math.max(0, pendingStyles - 1);
              maybeFinish();
            };
            const failed = () => {
              // onResourceError reports the failure and shows the retry.
              if (settled) return;
              settled = true;
            };

            link.addEventListener("load", loaded, { once: true });
            link.addEventListener("error", failed, { once: true });
            link.rel = "stylesheet";
            requestAnimationFrame(() => {
              if (link.sheet) loaded();
            });
          }
        };

        window.addEventListener("robosats:boot-stage", (event) => {
          const detail = event.detail || {};
          if (Number.isFinite(detail.progress)) stageTarget = Math.max(stageTarget, Math.min(95, detail.progress));
          if (detail.message) setMessage(detail.message);
        });

        window.addEventListener("robosats:app-ready", () => {
          appReady = true;
          stageTarget = Math.max(stageTarget, 95);
          if (pendingStyles > 0) setMessage("Applying the interface styles...");
          maybeFinish();
        }, { once: true });

        window.setTimeout(() => {
          if (finished) return;
          showRetry("Still preparing over Tor. You can keep waiting or try again.");
        }, 45000);

        const frame = (now) => {
          if (finished) return;
          const elapsed = now - startedAt;
          const delta = Math.min(64, now - previousFrame);
          previousFrame = now;

          if (!ready) stageTarget = Math.max(stageTarget, syntheticTarget(elapsed));
          const smoothing = 1 - Math.exp(-delta / (ready ? 105 : 260));
          shown += (stageTarget - shown) * smoothing;

          const rounded = Math.max(2, Math.min(100, Math.round(shown)));
          progress.style.width = `${rounded}%`;
          percent.textContent = `${rounded}%`;

          if (!appReady && !retryShown) {
            const nextMessage = Math.floor(elapsed / 1800) % messages.length;
            if (nextMessage !== messageIndex) {
              messageIndex = nextMessage;
              setMessage(messages[messageIndex]);
            }
          }

          requestAnimationFrame(frame);
        };

        requestAnimationFrame(activateApplicationStyles);
        requestAnimationFrame(frame);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
