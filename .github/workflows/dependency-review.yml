name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # GHSA-wrw7-89jp-8q8g: glib < 0.20.0 unsoundness in VariantStrIter
          # Upstream Tauri 2.x uses GTK3 (gtk 0.18.x) which requires glib ^0.18.
          # GTK4 migration (Tauri 3) is not yet stable. Exception removed when
          # Tauri publishes stable GTK4 support.
          allow-advisories: GHSA-wrw7-89jp-8q8g
