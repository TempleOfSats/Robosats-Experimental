name: Security scanning

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 19 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Validate Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK
        if: matrix.language == 'java-kotlin'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile Android sources
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew --no-daemon :app:compileDebugKotlin
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4

  dependency-audit:
    name: Locked dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies -- moderate
      - name: Install Rust audit tooling
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit Rust lockfiles
        run: |
          cargo audit --file android/tor-native/Cargo.lock --ignore RUSTSEC-2023-0071
          cargo audit --file android/robo-identities-native/Cargo.lock
          cargo audit --file ios/tor-native/Cargo.lock --ignore RUSTSEC-2023-0071
          cargo audit --file desktop/arti-sidecar/Cargo.lock --ignore RUSTSEC-2023-0071
